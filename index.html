<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft Save Auto-Zip & GitHub Uploader</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- JSZip để nén Folder thành file .zip ngay trên trình duyệt -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6 font-sans">
  <div class="max-w-2xl mx-auto bg-slate-800 p-8 rounded-2xl shadow-xl border border-slate-700">
    
    <h1 class="text-2xl font-bold mb-2 text-emerald-400 flex items-center gap-2">
      🎮 Minecraft Save Auto-Uploader
    </h1>
    <p class="text-slate-400 text-sm mb-6">Nén thư mục thế giới Minecraft thành ZIP và upload trực tiếp lên GitHub.</p>

    <!-- Cấu hình GitHub -->
    <div class="space-y-4 mb-6 bg-slate-800/50 p-4 rounded-xl border border-slate-700/50">
      <h2 class="text-sm font-semibold text-slate-300 uppercase tracking-wider">Cấu hình GitHub</h2>
      <div>
        <label class="block text-xs text-slate-400 mb-1">GitHub Personal Access Token (PAT)</label>
        <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxx" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs text-slate-400 mb-1">GitHub Owner (User/Org)</label>
          <input type="text" id="ghOwner" placeholder="username" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Repository Name</label>
          <input type="text" id="ghRepo" placeholder="minecraft-backups" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
        </div>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs text-slate-400 mb-1">Branch</label>
          <input type="text" id="ghBranch" value="main" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Folder trên Repo (Tùy chọn)</label>
          <input type="text" id="ghFolderPath" placeholder="saves/" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
        </div>
      </div>
    </div>

    <!-- Hỗ trợ chọn Minecraft Save -->
    <div class="mb-6 p-4 bg-emerald-950/30 border border-emerald-800/50 rounded-xl">
      <div class="flex items-center justify-between gap-4">
        <div>
          <p class="text-xs font-semibold text-emerald-400">Đường dẫn Save Minecraft:</p>
          <code class="text-xs text-slate-300 bg-slate-900 px-2 py-1 rounded mt-1 inline-block">%appdata%\.minecraft\saves</code>
        </div>
        <button onclick="copyPath()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-2 rounded-lg font-medium transition">
          📋 Copy đường dẫn
        </button>
      </div>
      <p id="copyTooltip" class="text-xs text-emerald-400 mt-2 hidden">✓ Đã copy! Hãy dán (Ctrl+V) vào thanh địa chỉ khi cửa sổ chọn thư mục mở ra.</p>
    </div>

    <!-- Chọn Folder & Tải lên -->
    <div class="space-y-4">
      <label class="block text-sm font-medium text-slate-300">Chọn thư mục World Minecraft để Zip & Upload:</label>
      
      <input type="file" id="folderInput" webkitdirectory directory multiple class="hidden" onchange="handleFolderSelect(event)">
      
      <button onclick="document.getElementById('folderInput').click()" class="w-full border-2 border-dashed border-slate-600 hover:border-emerald-500 bg-slate-900/50 hover:bg-slate-900 text-slate-300 py-8 rounded-xl flex flex-col items-center justify-center transition cursor-pointer">
        <span class="text-3xl mb-2">📁</span>
        <span class="text-sm font-medium">Bấm vào đây để chọn thư mục World Minecraft</span>
        <span class="text-xs text-slate-500 mt-1">(Hệ thống sẽ tự động zip thành 1 file duy nhất)</span>
      </button>

      <div id="statusArea" class="hidden space-y-2">
        <div class="flex justify-between text-xs text-slate-400">
          <span id="statusText">Đang xử lý...</span>
          <span id="progressPercent">0%</span>
        </div>
        <div class="w-full bg-slate-700 h-2 rounded-full overflow-hidden">
          <div id="progressBar" class="bg-emerald-500 h-full w-0 transition-all duration-200"></div>
        </div>
      </div>
    </div>

  </div>

  <script>
    // 1. Copy đường dẫn Save vào Clipboard
    function copyPath() {
      navigator.clipboard.writeText("%appdata%\\.minecraft\\saves");
      const tooltip = document.getElementById('copyTooltip');
      tooltip.classList.remove('hidden');
      setTimeout(() => tooltip.classList.add('hidden'), 4000);
    }

    // 2. Xử lý khi chọn Folder
    async function handleFolderSelect(event) {
      const files = event.target.files;
      if (!files || files.length === 0) return;

      const token = document.getElementById('ghToken').value.trim();
      const owner = document.getElementById('ghOwner').value.trim();
      const repo = document.getElementById('ghRepo').value.trim();
      const branch = document.getElementById('ghBranch').value.trim() || 'main';
      let folderPath = document.getElementById('ghFolderPath').value.trim();

      if (!token || !owner || !repo) {
        alert('Vui lòng điền đầy đủ GitHub Token, Owner và Repo!');
        return;
      }

      // Xác định tên thư mục gốc (Tên thế giới Minecraft)
      const firstFilePath = files[0].webkitRelativePath;
      const worldFolderName = firstFilePath.split('/')[0] || 'Minecraft_World';
      const zipFileName = `${worldFolderName}_${Date.now()}.zip`;

      const statusArea = document.getElementById('statusArea');
      const statusText = document.getElementById('statusText');
      const progressBar = document.getElementById('progressBar');
      const progressPercent = document.getElementById('progressPercent');

      statusArea.classList.remove('hidden');
      
      try {
        // --- BƯỚC 1: TỰ ĐỘNG ZIP FOLDER ---
        statusText.innerText = `Đang nén thư mục "${worldFolderName}" thành ZIP...`;
        progressBar.style.width = '20%';
        progressPercent.innerText = '20%';

        const zip = new JSZip();
        for (let i = 0; i < files.length; i++) {
          const file = files[i];
          // Giữ nguyên cấu trúc thư mục con trong ZIP
          const relativePath = file.webkitRelativePath.substring(worldFolderName.length + 1);
          if (relativePath) {
            zip.file(relativePath, file);
          }
        }

        const zipBlob = await zip.generateAsync({ type: "blob" }, (metadata) => {
          const p = Math.round(20 + (metadata.percent * 0.3));
          progressBar.style.width = `${p}%`;
          progressPercent.innerText = `${p}%`;
        });

        // --- BƯỚC 2: ĐẨY FILE ZIP LÊN GITHUB (Bằng Git Data API - Blobs) ---
        statusText.innerText = `Đang tải ${zipFileName} lên GitHub...`;
        progressBar.style.width = '60%';
        progressPercent.innerText = '60%';

        // Chuyển blob thành Base64
        const reader = new FileReader();
        reader.readAsDataURL(zipBlob);
        reader.onloadend = async () => {
          const base64Content = reader.result.split(',')[1];
          
          if (folderPath && !folderPath.endsWith('/')) folderPath += '/';
          const fullPathOnRepo = `${folderPath}${zipFileName}`;

          // Upload trực tiếp dùng GitHub Contents API
          const uploadUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${fullPathOnRepo}`;
          
          const response = await fetch(uploadUrl, {
            method: 'PUT',
            headers: {
              'Authorization': `token ${token}`,
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              message: `Backup Minecraft World: ${worldFolderName}`,
              content: base64Content,
              branch: branch
            })
          });

          if (response.ok) {
            progressBar.style.width = '100%';
            progressPercent.innerText = '100%';
            statusText.innerText = `✅ Đã nén & upload thành công file ${zipFileName}!`;
          } else {
            const err = await response.json();
            throw new Error(err.message || 'Lỗi upload lên GitHub');
          }
        };

      } catch (error) {
        alert(`Có lỗi xảy ra: ${error.message}`);
        statusText.innerText = `❌ Thất bại: ${error.message}`;
        progressBar.style.width = '0%';
      }
    }
  </script>
</body>
</html>
